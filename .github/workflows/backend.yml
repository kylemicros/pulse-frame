name: backend

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      UV_LOCKED: "1"
      PULSE_FRAME_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.12.23"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install EGL and GLES libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgles2

      - name: Dependency audit
        run: uv audit --preview-features audit-command

      - name: Install dependencies
        run: uv sync --locked

      - name: Download face model
        run: uv run python -m pulse_frame.vision.model

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Deprecated usage
        run: uv run ty check

      - name: Tests
        run: uv run pytest
