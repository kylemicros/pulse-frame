[project]
name = "pulse-frame"
version = "0.1.0"
description = "Local camera heart rate monitor backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "mediapipe>=1.2.2",
    "numpy",
    "scipy",
    "uvicorn>=0.54.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-timeout>=2.4.0",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH", "ASYNC",
    "FURB", "PERF", "PIE", "C4", "RET", "NPY", "FAST", "PLE", "PLW",
    "PLC0206", "PLC0207", "PLC0208", "PLC0414", "PLC1802", "PLC3002",
    "PLR0124", "PLR0133", "PLR0402", "PLR1704", "PLR1711", "PLR1714",
    "PLR1716", "PLR1722", "PLR1730", "PLR1733", "PLR1736", "PLR5501",
    "FURB101", "FURB103", "FURB113", "FURB131", "FURB142", "FURB148", "FURB152",
    "PLC2701", "PLR6201", "PLW1514",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
timeout_method = "thread"
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning',
]
